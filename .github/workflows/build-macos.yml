name: Build macOS Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: paper-orchestra-desktop

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain (Universal macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Universal macOS App & DMG
        run: npx tauri build --target universal-apple-darwin

      - name: Upload macOS DMG & App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PaperOrchestra-Studio-macOS-Universal
          path: |
            paper-orchestra-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            paper-orchestra-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
