name: Plugin parity (5 platforms + Muse)

# Fails when the Claude Code, Antigravity, Codex, Qoder, WorkBuddy and Muse bundles
# stop exposing the same servers, tools, skills and agents.
on:
  push:
    branches: [main]
    paths: ["plugins/**", "paper-orchestra/utils/**", "integrations/qoder-plugin/**", ".claude-plugin/**", ".agents/**", ".codebuddy-plugin/**", ".github/workflows/plugin-parity.yml"]
  pull_request:
    paths: ["plugins/**", "paper-orchestra/utils/**", "integrations/qoder-plugin/**", ".claude-plugin/**", ".agents/**", ".codebuddy-plugin/**", ".github/workflows/plugin-parity.yml"]

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Bundles are compared byte for byte, so keep line endings exactly as committed.
      - name: Keep committed line endings (Windows)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundles are in sync with plugins/shared
        run: python plugins/scripts/sync_platforms.py --check
      - name: Static + live parity check
        run: python plugins/scripts/verify_platforms.py --strict
      - name: Unit tests
        run: python -m unittest discover -s plugins/tests -v
