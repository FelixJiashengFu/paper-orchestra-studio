<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperOrchestra Studio · 实时论文工作台</title>
  <style>:root {
  --bg: #f2f3ee;
  --surface: #fffefa;
  --surface-2: #f7f8f3;
  --ink: #1d2b25;
  --muted: #58635c;
  --line: #d7ddd5;
  --green: #2f6b57;
  --green-dark: #203e33;
  --green-soft: #e7f0ea;
  --amber: #8a5917;
  --amber-soft: #faf0dc;
  --red: #9b3f34;
  --red-soft: #f8e8e4;
  --blue: #356b85;
  --blue-soft: #e6f0f5;
  --shadow: 0 10px 28px rgba(29, 43, 37, 0.07);
  --radius: 12px;
  --radius-sm: 8px;
  --sans: var(--font-sans, Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif);
  --mono: "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: var(--color-background-primary, #131917);
  --surface: var(--color-background-secondary, #1a2320);
  --surface-2: var(--color-background-tertiary, #202c28);
  --ink: var(--color-text-primary, #eef3ef);
  --muted: var(--color-text-secondary, #a2b3aa);
  --line: var(--color-border-primary, #2c3a35);
  --green: #5fb090;
  --green-dark: #142620;
  --green-soft: rgba(95, 176, 144, 0.16);
  --amber: #eab364;
  --amber-soft: rgba(234, 179, 100, 0.16);
  --red: #e57c70;
  --red-soft: rgba(229, 124, 112, 0.16);
  --blue: #6cb0cf;
  --blue-soft: rgba(108, 176, 207, 0.16);
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.mono {
  font-family: var(--mono);
  font-size: 12px;
  word-break: break-all;
}

/* App Shell */
.po-shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 100vh;
}

.po-sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  background: var(--green-dark);
  color: #f4f7f3;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.po-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 18px;
}

.po-brand-mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.09);
  font-family: var(--mono);
  font-weight: 800;
  font-size: 13px;
  color: #fff;
  flex: none;
}

.po-brand strong {
  display: block;
  font-size: 14px;
  letter-spacing: -0.01em;
}

.po-brand span {
  display: block;
  color: #b8c9bf;
  font-size: 11.5px;
}

.po-nav {
  display: grid;
  gap: 4px;
  overflow-y: auto;
}

.po-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #d7e2db;
  text-align: left;
  font-size: 13px;
  transition: background 0.14s ease, color 0.14s ease;
}

.po-nav-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.po-nav-btn.active {
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 3px 0 #9fc7b2;
  font-weight: 600;
}

.po-nav-icon {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  color: #a9c2b4;
  flex: none;
}

.po-nav-icon svg {
  width: 16px;
  height: 16px;
}

.po-nav-count {
  margin-left: auto;
  min-width: 22px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  color: #c8d8ce;
  font-size: 11.5px;
  text-align: center;
}

.po-sidebar-foot {
  margin-top: auto;
  padding: 12px 10px 4px;
  color: #a9bdb2;
  font-size: 11.5px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.po-sidebar-foot strong {
  display: block;
  margin-bottom: 3px;
  color: #e4ede7;
}

.po-compact-bar {
  display: none;
}

.po-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.po-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.po-topbar-title strong {
  display: block;
  font-size: 14px;
}

.po-topbar-title span {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
}

.po-topbar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.po-content {
  padding: 18px 20px 32px;
  max-width: 1220px;
  width: 100%;
  margin: 0 auto;
}

@media (max-width: 859px) {
  .po-shell {
    grid-template-columns: 1fr;
  }
  .po-sidebar {
    display: none;
  }
  .po-compact-bar {
    display: block;
    background: var(--green-dark);
    color: #f4f7f3;
    padding: 10px 12px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .po-compact-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .po-compact-brand strong {
    font-size: 13.5px;
  }
  .po-compact-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .po-compact-tabs .po-nav-btn {
    width: auto;
    flex: 0 0 auto;
    min-height: 30px;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
  }
  .po-compact-tabs .po-nav-btn.active {
    background: #fffefa;
    color: #1d2b25;
    box-shadow: none;
  }
  .po-content {
    padding: 12px 12px 24px;
  }
  .po-topbar {
    padding: 8px 12px;
  }
}

/* Typography & Layout Primitives */
.eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 4px;
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.page-head h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.015em;
}

.page-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
  max-width: 680px;
}

.grid {
  display: grid;
  gap: 12px;
}

.grid-2 {
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}

.grid-4 {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
}

.card-pad {
  padding: 14px 16px;
}

.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}

.card-head h2, .card-head h3 {
  margin: 0;
  font-size: 14.5px;
}

.card-head p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.card-body {
  padding: 14px 16px;
}

.run-hero {
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(145deg, var(--surface) 0%, var(--green-soft) 100%);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

.run-hero h2 {
  margin: 2px 0 6px;
  font-size: 18px;
}

.run-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.stage-track {
  display: grid;
  grid-template-columns: repeat(8, minmax(56px, 1fr));
  gap: 5px;
  margin-top: 12px;
  overflow-x: auto;
}

.stage-step {
  text-align: center;
  padding: 5px 4px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 11.5px;
  color: var(--muted);
}

.stage-step.done {
  border-color: #b7d3c3;
  background: var(--green-soft);
  color: var(--green);
  font-weight: 650;
}

.stage-step.current {
  border-color: var(--green);
  background: var(--green);
  color: #fff;
  font-weight: 700;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
}

.stat-label {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
}

.stat-value {
  display: block;
  font-size: 21px;
  font-weight: 800;
  margin: 2px 0;
}

.stat-note {
  font-size: 11.5px;
  color: var(--muted);
}

/* Pills & Buttons */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink);
}

.pill.green {
  color: var(--green);
  background: var(--green-soft);
  border-color: color-mix(in srgb, var(--green) 32%, transparent);
}

.pill.amber {
  color: var(--amber);
  background: var(--amber-soft);
  border-color: color-mix(in srgb, var(--amber) 32%, transparent);
}

.pill.red {
  color: var(--red);
  background: var(--red-soft);
  border-color: color-mix(in srgb, var(--red) 32%, transparent);
}

.pill.blue {
  color: var(--blue);
  background: var(--blue-soft);
  border-color: color-mix(in srgb, var(--blue) 32%, transparent);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 11px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  transition: filter 0.12s ease, background 0.12s ease;
}

.btn:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn.primary {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

.btn.primary:hover:not(:disabled) {
  background: var(--green-dark);
}

.btn.danger {
  background: var(--red-soft);
  border-color: color-mix(in srgb, var(--red) 35%, transparent);
  color: var(--red);
}

.btn.small {
  min-height: 27px;
  padding: 3px 9px;
  font-size: 11.5px;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

/* Forms & Tables */
.field {
  display: grid;
  gap: 5px;
  margin-bottom: 10px;
}

.field label {
  font-size: 12px;
  font-weight: 650;
  color: var(--muted);
}

input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

textarea {
  resize: vertical;
  min-height: 78px;
}

textarea.code-editor {
  min-height: 290px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

th, td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

th {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  background: var(--surface-2);
}

/* Callouts & Pre */
.callout {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  margin-bottom: 12px;
  font-size: 12.5px;
}

.callout.warning {
  background: var(--amber-soft);
  border-color: color-mix(in srgb, var(--amber) 35%, transparent);
}

.callout.error {
  background: var(--red-soft);
  border-color: color-mix(in srgb, var(--red) 35%, transparent);
}

.callout.success {
  background: var(--green-soft);
  border-color: color-mix(in srgb, var(--green) 35%, transparent);
}

pre.po-pre {
  margin: 0;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.48;
  max-height: 300px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Canvas Console Chips */
.preset-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.chip {
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 600;
}

.chip:hover {
  border-color: var(--green);
  color: var(--green);
}

.chip.active {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

/* Interactive Figure BBox Stage */
.bbox-stage-wrap {
  display: grid;
  gap: 10px;
}

.bbox-stage {
  position: relative;
  display: inline-block;
  max-width: 100%;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  overflow: hidden;
  user-select: none;
  touch-action: none;
  cursor: crosshair;
}

.bbox-stage img {
  display: block;
  max-width: 100%;
  max-height: 420px;
  pointer-events: none;
}

.bbox-rect {
  position: absolute;
  border: 2px dashed #c7382b;
  background: rgba(199, 56, 43, 0.14);
  pointer-events: none;
}

.bbox-label {
  position: absolute;
  top: -22px;
  left: 0;
  padding: 1px 6px;
  border-radius: 4px;
  background: #c7382b;
  color: #fff;
  font-family: var(--mono);
  font-size: 10.5px;
  white-space: nowrap;
}

/* Tool Tree */
.tree-group {
  border: 1px solid var(--line);
  border-top: 4px solid var(--group, var(--green));
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  overflow: hidden;
}

.tree-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 15px;
  background: var(--group-soft, var(--surface-2));
  cursor: pointer;
}

.tree-nodes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 8px;
  padding: 12px 14px;
}

.tree-node {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  text-align: left;
}

.tree-node:hover {
  border-color: var(--group, var(--green));
  background: var(--surface);
}

/* Modal & Toast */
.po-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 22, 19, 0.56);
  backdrop-filter: blur(4px);
}

.po-modal {
  width: min(560px, 100%);
  max-height: 86vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 22px 54px rgba(0, 0, 0, 0.28);
  padding: 18px 20px;
}

.po-toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 60;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--green-dark);
  color: #fff;
  font-size: 12.5px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
}

.po-toast.error {
  background: #8d2f25;
}

/* Inline PDF Preview */
.pdf-preview-stage {
  max-height: 760px;
  overflow: auto;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface-2) 86%, #1d2420);
}

.pdf-page-img {
  display: block;
  max-width: none;
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
}

.pdf-jump-input {
  width: 64px;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 12px;
  text-align: center;
}

/* Overleaf-style Split View & Bidirectional SyncTeX */
.latex-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.latex-split.stacked {
  grid-template-columns: 1fr;
}

@media (max-width: 980px) {
  .latex-split {
    grid-template-columns: 1fr;
  }
}

.latex-split .code-editor {
  min-height: 620px;
  height: 680px;
  line-height: 1.5;
  font-size: 12.5px;
}

.latex-split .pdf-preview-stage {
  height: 680px;
  max-height: 680px;
  text-align: center;
}

.pdf-page-wrap {
  position: relative;
  display: inline-block;
  margin: 0 auto;
  line-height: 0;
}

.pdf-page-wrap .pdf-page-img {
  width: 100%;
  height: auto;
}

.pdf-page-img.clickable {
  cursor: crosshair;
}

.synctex-highlight {
  position: absolute;
  pointer-events: none;
  z-index: 4;
  background: rgba(250, 204, 21, 0.34);
  border: 2px solid #eab308;
  border-radius: 4px;
  box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.22);
  animation: synctexPulse 1.4s ease-out 1;
}

.synctex-highlight-tag {
  position: absolute;
  top: -20px;
  left: -2px;
  padding: 2px 6px;
  border-radius: 4px;
  background: #ca8a04;
  color: #fff;
  font-size: 10px;
  line-height: 1.2;
  white-space: nowrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

@keyframes synctexPulse {
  0% {
    box-shadow: 0 0 0 8px rgba(234, 179, 8, 0.45);
    background: rgba(250, 204, 21, 0.52);
  }
  100% {
    box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.22);
    background: rgba(250, 204, 21, 0.34);
  }
}

.ltx-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-muted);
  cursor: pointer;
  user-select: none;
}
</style>
</head>
